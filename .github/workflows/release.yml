# Release: build the binaries for every supported target on a version
# tag and publish them as a GitHub release with checksums.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # build.rs stamps the commit height as build number
          fetch-depth: 0
      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml" \
              "version ${version}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="kartei-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/kartei" "dist/${name}/"
          cp README.md "dist/${name}/"
          cp -r systemd "dist/${name}/"
          [ -f LICENSE ] && cp LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          # Tags like v1.0.0-rc1 are published as prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
