[package]
name = "kartei"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
globset = "0.4.19"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-erlang = "0.20.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1.7"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[build-dependencies]
cc = "1.4.0"

[dev-dependencies]
tempfile = "3.27.0"

# Grammar crates carry generated C parsers; without optimization they
# parse an order of magnitude slower, which drags the integration
# tests. Dependencies stay optimized, kartei itself keeps debug info.
[profile.dev.package."*"]
opt-level = 2
